# Render Blueprint (API: server.cjs)
# Naujas Web Service → „Apply render.yaml“ arba rankiniu: Build npm ci, Start npm start.
# Slaptus raktus (RESEND, SUPABASE_SERVICE_ROLE_KEY ir kt.) įveskite Render → Environment.

services:
  - type: web
    name: svarus-darbas-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # OPENCODE_API_KEY įrašykite Render Dashboard (Blueprint negali saugiai laikyti secrets).
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_VARIANT
        value: go
      - key: OPENCODE_MODEL
        value: glm-5
